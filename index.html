/* ---------- DERIVACIÓN: el corazón ---------- */
function derive(){
  S.products.forEach(p=>{p.stock=0;p.avgCost=p.seedCost??null});
  const ms=[...S.movements].sort((a,b)=>
    a.date<b.date?-1:a.date>b.date?1:((a.created_at||'')<(b.created_at||'')?-1:1));
  ms.forEach(m=>{
    if(!m.pid)return; const p=P(m.pid); if(!p)return;
    if(m.type==='PURCHASE'){
      const tot=p.stock+m.units;
      // el promedio ponderado solo cambia al comprar
      p.avgCost = tot>0 ? ((p.stock*(p.avgCost||0))+(m.units*m.unitCost))/tot : m.unitCost;
      p.stock=tot;
    } else if(m.type==='ADJUST'){
      // si trae casilla: es una RECOLOCACIÓN entre bodega y esa casilla (no toca el total,
      // esas unidades ya estaban contadas). Sin casilla: corrección real del total general.
      // (La base de datos de Supabase solo permite estos 5 tipos de movimiento — por eso
      // la recolocación por casilla también usa ADJUST en vez de un tipo nuevo tipo LOAD.)
      if(m.slot==null) p.stock+=m.units;
    } else if(m.type==='LOAD'){
      // tipo heredado (ya no se genera): igual que ADJUST-con-casilla, no toca el total
    } else p.stock-=m.units;     // SALE y WRITEOFF
  });
  deriveSlots(ms);
}

/* ---------- casillas físicas / bodega ----------
   Compra y Merma son por producto (van al "total"); Venta, Corrección y
   Carga pueden traer `slot`. El contador de cada casilla arranca en 0 y
   solo se mueve con movimientos que traigan esa casilla — así la diferencia
   entre el total del producto y la suma de sus casillas es "bodega":
   mercancía comprada que todavía no se cargó físicamente a la máquina.
   LOAD (Cargar a máquina, desde Bodega) sube la casilla sin subir el total,
   porque esas unidades ya estaban contadas en el total al comprarlas.     */
function deriveSlots(ms){
  S.products.forEach(p=>{p.slotStock={}; p.slots.forEach(s=>p.slotStock[s]=0)});
  ms.forEach(m=>{
    if(!m.pid||m.slot==null)return; const p=P(m.pid); if(!p||!(m.slot in p.slotStock))return;
    if(m.type==='ADJUST'||m.type==='LOAD') p.slotStock[m.slot]+=m.units;
    else if(m.type==='SALE') p.slotStock[m.slot]-=m.units;
  });
}

/* ---------- escritura ----------
   La casilla NO usa una columna nueva en Supabase (no hace falta tocar la base de
   datos): se guarda codificada al inicio de la nota, como "[[slot 41]] texto real",
   y se decodifica sola al cargar. Así todo funciona sobre las columnas que ya existen. */
function toRow(m){
  const note = m.slot!=null ? `[[slot ${m.slot}]] ${m.note||''}`.trim() : (m.note||null);
  return{id:m.id,date:m.date,type:m.type,pid:m.pid??null,units:m.units??null,
  unit_cost:m.unitCost??null,unit_price:m.unitPrice??null,cat:m.cat??null,
  amount:m.amount??null,note}
}
function parseSlotNote(raw){
  if(!raw) return {slot:null, note:raw};
  const m=raw.match(/^\[\[slot (\d+)\]\] ?(.*)$/s);
  return m ? {slot:+m[1], note:m[2]||null} : {slot:null, note:raw};
}

async function push(mv){
  S.movements.push(mv); derive(); render();
  const {error}=await sb.from('movements').insert(toRow(mv));
  if(error){cola.add(mv);setSync()}
  return mv.id;
}
async function flush(){
  for(const mv of cola.get()){
    const {error}=await sb.from('movements').insert(toRow(mv));
    if(error) break;
    cola.del(mv.id);
  }
  setSync();
}
const purchase=(pid,u,c,d,n)=>push({id:uid(),date:d,type:'PURCHASE',pid,units:u,unitCost:c,note:n,created_at:new Date().toISOString()});

// slot: si viene, corrige esa casilla puntual; si no, corrige el total general del producto.
const ajuste=(pid,delta,d,n,slot)=>push({id:uid(),date:d,type:'ADJUST',pid,units:delta,unitCost:P(pid).avgCost||0,note:n,slot:slot??null,created_at:new Date().toISOString()});

const cargar=(pid,u,d,slot,n)=>push({id:uid(),date:d,type:'ADJUST',pid,units:u,unitCost:P(pid).avgCost||0,note:n,slot,created_at:new Date().toISOString()});

/* ---------- categorías de producto ----------
   La lista es la UNIÓN de la tabla `categories` y los cat que ya traen
   los productos. Si un rename se corta a media conexión, la categoría
   vieja sigue viva mientras tenga productos: nunca queda un huérfano
   invisible. Y si todavía no corriste el SQL, la app funciona igual
   en modo solo-lectura derivado.                                      */
function catList(){
  const s=new Set(S.cats);
  S.products.forEach(p=>{if(p.cat)s.add(p.cat)});
  return [...s].sort((a,b)=>a.localeCompare(b,'es'));
}
const catCount=c=>S.products.filter(p=>p.cat===c).length;
const catDup=(n,except)=>catList().some(c=>c!==except&&c.toLowerCase()===n.toLowerCase());

async function catAdd(name){
  name=(name||'').trim().slice(0,32);
  if(!name) return toast('Escribí un nombre');
  if(catDup(name)) return toast(`"${name}" ya existe`);
  S.cats.push(name); render();
  const {error}=await sb.from('categories').insert({name});
  if(error) toast('Guardada local — no subió a la nube');
  else toast(`Categoría "${name}" agregada`);
}

async function catRename(oldN,newN){
  newN=(newN||'').trim().slice(0,32);
  if(!newN||newN===oldN) return;
  if(catDup(newN,oldN)) return toast(`"${newN}" ya existe`);
  const n=catCount(oldN);
  S.cats=S.cats.filter(c=>c!==oldN); S.cats.push(newN);
  S.products.forEach(p=>{if(p.cat===oldN)p.cat=newN});
  render(); toast(`${oldN} → ${newN}${n?` · ${n} producto${n===1?'':'s'}`:''}`);
  await sb.from('categories').insert({name:newN});
  if(n) await sb.from('products').update({cat:newN}).eq('cat',oldN);
  await sb.from('categories').delete().eq('name',oldN);
}

async function catDelete(name,moveTo){
  const n=catCount(name);
  if(n&&!moveTo) return toast('Falta a dónde mandar los productos');
  S.cats=S.cats.filter(c=>c!==name);
  if(n) S.products.forEach(p=>{if(p.cat===name)p.cat=moveTo});
  render(); toast(n?`"${name}" eliminada · ${n} → ${moveTo}`:`"${name}" eliminada`);
  if(n) await sb.from('products').update({cat:moveTo}).eq('cat',name);
  await sb.from('categories').delete().eq('name',name);
}

async function setProdCat(pid,cat){
  const p=P(pid); if(!p||p.cat===cat) return;
  p.cat=cat; render();
  const {error}=await sb.from('products').update({cat}).eq('id',pid);
  if(error) toast('No se pudo guardar el cambio');
}

/* Casillas: separadas por coma, 1-60, sin repetir dentro del mismo producto y sin
   pisar casillas que ya usa otro producto (si hay choque, se avisa y no se guarda). */
async function setProdSlots(pid,raw){
  const p=P(pid); if(!p) return;
  const nums=[...new Set(raw.split(',').map(s=>s.trim()).filter(Boolean).map(Number))]
    .filter(n=>Number.isInteger(n)&&n>=1&&n<=60).sort((a,b)=>a-b);
  const taken={};
  S.products.forEach(o=>{if(o.id!==pid)o.slots.forEach(s=>taken[s]=o.name)});
  const conflict=nums.find(n=>taken[n]);
  if(conflict){ toast(`La casilla ${conflict} ya la usa ${taken[conflict]}`); render(); return; }
  const before=p.slots.join(',');
  p.slots=nums; render();
  const {error}=await sb.from('products').update({slots:nums}).eq('id',pid);
  if(error){ toast('No se pudo guardar el cambio'); return; }
  toast(nums.length?`${p.name}: casillas ${nums.join(',')}`:`${p.name}: sin casilla (en standby, disponible en Bodega)`);
}

/* ---------- P&L ---------- */
function pnl(month){
  let rev=0,cogs=0,mer=0,gas=0,adj=0; const byProd={};
  S.movements.filter(m=>ym(m.date)===month).forEach(m=>{
    if(m.type==='SALE'){
      const r=m.units*m.unitPrice,c=m.units*m.unitCost; rev+=r; cogs+=c;
      const b=byProd[m.pid]||(byProd[m.pid]={u:0,r:0,c:0}); b.u+=m.units;b.r+=r;b.c+=c;
    } else if(m.type==='WRITEOFF') mer+=m.units*m.unitCost;
    else if(m.type==='ADJUST') adj+=m.units*(m.unitCost||0);
    else if(m.type==='EXPENSE') gas+=m.amount;
  });
  const opProfit=rev-cogs-mer-gas;
  const pct=(S.settings.commissionPct||0)/100;
  const comision=Math.max(0,opProfit*pct);   // nunca negativa
  return {rev,cogs,gross:rev-cogs,merma:mer,gastos:gas,adj,opProfit,comision,pct,net:opProfit-comision,byProd};
}
const invValue=()=>S.products.reduce((s,p)=>s+p.stock*(p.avgCost||0),0);
const months=()=>{const s=new Set(S.movements.map(m=>ym(m.date)));s.add(ym(today()));return[...s].sort().reverse()};

let tT;
function toast(msg,undoId){
  const t=el('toast');
  t.innerHTML=esc(msg)+(undoId?`<button data-u="${undoId}">Deshacer</button>`:'');
  const b=t.querySelector('button');
  if(b)b.onclick=()=>{undo(b.dataset.u);t.style.display='none'};
  t.style.display='block'; clearTimeout(tT); tT=setTimeout(()=>t.style.display='none',4200);
}
const closeModal=()=>el('modal').innerHTML='';
function setSync(){
  const n=cola.get().length;
  el('hdrStat').innerHTML=n
    ? `<span class="dot" style="background:var(--amber)"></span>${n} sin subir`
    : `Inventario ${Q0(invValue())} · Utilidad ${Q0(pnl(plMonth||ym(today())).net)}`;
}

async function load(){
  const [pr,mv,st,ct]=await Promise.all([
    sb.from('products').select('*'),
    sb.from('movements').select('*'),
    sb.from('settings').select('*').maybeSingle(),
    sb.from('categories').select('*')
  ]);
  if(pr.error) throw pr.error;
  if(mv.error) throw mv.error;
  // si `categories` todavía no existe, seguimos con las derivadas de products
  S.cats=ct.error?[]:(ct.data||[]).map(r=>r.name).filter(Boolean);

  if(!pr.data.length){                       // primera vez: sembrar catálogo
    const rows=SEED.map(([id,name,cat,cost,price,slots])=>({id,name,cat,price,seed_cost:cost,slots}));
    const {error}=await sb.from('products').insert(rows); if(error) throw error;
    S.products=rows.map(r=>({id:r.id,name:r.name,cat:r.cat,price:+r.price,
      seedCost:r.seed_cost,slots:r.slots,stock:0,avgCost:r.seed_cost}));
  } else {
    S.products=pr.data.map(r=>({id:r.id,name:r.name,cat:r.cat,price:+r.price,
      seedCost:r.seed_cost==null?null:+r.seed_cost,slots:r.slots||[],stock:0,avgCost:null}));
  }
  S.movements=(mv.data||[]).map(r=>{
    const {slot,note}=parseSlotNote(r.note);
    return {id:r.id,date:r.date,type:r.type,pid:r.pid,
    units:r.units==null?null:+r.units,unitCost:r.unit_cost==null?null:+r.unit_cost,
    unitPrice:r.unit_price==null?null:+r.unit_price,cat:r.cat,
    amount:r.amount==null?null:+r.amount,note,
    slot,created_at:r.created_at};
  });
  cola.get().forEach(m=>{if(!S.movements.find(x=>x.id===m.id))S.movements.push(m)});

  if(st.data) S.settings.commissionPct=+st.data.commission_pct;
  else await sb.from('settings').insert({id:1,commission_pct:20});
  derive();
}

async function applyConteo(){
  const slots={}; S.products.forEach(p=>p.slots.forEach(s=>slots[s]=p));
  const acc=[];
  for(let i=1;i<=60;i++){
    const p=slots[i]; if(!p) continue;
    const v=el('cnt_'+i).value; if(v==='')continue;
    const n=p.slotStock[i]??0, d=n-(+v); if(d!==0) acc.push([i,p.id,d]);
  }
  const modo=el('cntMode').value;
  let u=0;
  for(const [slot,pid,d] of acc){
    if(modo==='ADJUST'){ await cargar(pid,-d,today(),slot,'conteo'); }
    else if(d>0){ await sell(pid,d,today(),'conteo',slot); u+=d; }
    else { await cargar(pid,-d,today(),slot,'sobrante de conteo'); }
  }
  tab='maquina'; render();
  toast(modo==='ADJUST'?`${acc.length} casillas corregidas`:`${u} unidades vendidas en ${acc.length} casillas`);
}

    <p class="hint">Sin login. Cualquiera con esta URL puede ver y editar. Exportá el CSV seguido.</p></div>`;
}

function vCats(){
  const cs=catList();
  return `<div class="card"><div class="eyebrow">Categorías de producto</div>
    ${cs.length?`<table><tbody>
    ${cs.map(c=>{const n=catCount(c);
      return `<tr><td>${esc(c)}<br><span class="tag${n?'':' bad'}">${n?n+' producto'+(n===1?'':'s'):'sin uso'}</span></td>
      <td class="r" style="width:62px;white-space:nowrap">
        <button data-cren="${esc(c)}" title="Renombrar" style="background:none;border:0;color:var(--dim);cursor:pointer;font-size:13px;padding:4px 5px">✎</button>
        <button data-cdel="${esc(c)}" title="Eliminar" style="background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;padding:4px 5px">×</button></td></tr>`}).join('')}
    </tbody></table>`:'<p class="hint" style="margin-top:0">Todavía no hay categorías.</p>'}
    <div class="row" style="margin-top:12px;align-items:flex-end">
      <div style="flex:1"><label>Nueva categoría</label><input id="ncat" maxlength="32" placeholder="Energizantes"></div>
      <div style="flex:0 0 96px"><button class="act" id="btnCat" style="margin-top:0">Agregar</button></div>
    </div>
    <p class="hint">Renombrar arrastra a todos sus productos. Al eliminar una que tenga productos, Vendos te pregunta a dónde mandarlos: ningún producto queda colgado.</p></div>`;
}

function catRenModal(name){
  el('modal').innerHTML=`<div class="scrim"><div class="sheet">
    <div class="eyebrow">Renombrar categoría</div><h2 style="font-size:20px">${esc(name)}</h2>
    <p class="hint" style="margin-top:4px">${catCount(name)} producto(s) se mueven con ella.</p>
    <label style="margin-top:12px">Nombre nuevo</label>
    <input id="crv" maxlength="32" value="${esc(name)}">
    <button class="act" id="crok">Renombrar</button>
    <button class="act ghost" id="crx">Cancelar</button></div></div>`;
  const i=el('crv'); i.focus(); i.select();
  el('crx').onclick=closeModal;
  el('modal').querySelector('.scrim').onclick=e=>{if(e.target===e.currentTarget)closeModal()};
  i.onkeydown=e=>{if(e.key==='Enter')el('crok').click()};
  el('crok').onclick=()=>{const v=i.value; closeModal(); catRename(name,v)};
}

function catDelModal(name){
  const n=catCount(name), others=catList().filter(c=>c!==name);
  if(!n){ if(confirm(`¿Eliminar la categoría "${name}"?`)) catDelete(name); return; }
  if(!others.length) return toast('Creá otra categoría antes de eliminar esta');
  el('modal').innerHTML=`<div class="scrim"><div class="sheet">
    <div class="eyebrow">Eliminar categoría</div><h2 style="font-size:20px">${esc(name)}</h2>
    <div class="warn" style="margin:12px 0">Tiene <b>${n} producto${n===1?'':'s'}</b>. Elegí a dónde van antes de borrarla.</div>
    <label>Mover los productos a</label>
    <select id="cdt">${others.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
    <button class="act" id="cdok">Eliminar y mover</button>
    <button class="act ghost" id="cdx">Cancelar</button></div></div>`;
  el('cdx').onclick=closeModal;
  el('modal').querySelector('.scrim').onclick=e=>{if(e.target===e.currentTarget)closeModal()};
  el('cdok').onclick=()=>{const to=el('cdt').value; closeModal(); catDelete(name,to)};
}

function vLibro(){
  const ms=[...S.movements].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,200);
  if(!ms.length)return `<div class="card"><p class="hint" style="margin-top:0">El libro está vacío. Todo lo que registres aparece acá, y de acá sale todo lo demás.</p></div>`;
  const L={PURCHASE:'Compra',SALE:'Venta',WRITEOFF:'Merma',ADJUST:'Corrección',LOAD:'Carga',EXPENSE:'Gasto'};
  const C={PURCHASE:'var(--blue)',SALE:'var(--green)',WRITEOFF:'var(--red)',ADJUST:'var(--muted)',LOAD:'var(--blue)',EXPENSE:'var(--amber)'};
  const pend=new Set(cola.get().map(m=>m.id));
  return `<div class="card"><div class="eyebrow">Movimientos · origen de verdad</div><table><tbody>
    ${ms.map(m=>{const p=m.pid?P(m.pid):null;
      const amt=m.type==='EXPENSE'?m.amount:m.type==='SALE'?m.units*m.unitPrice:m.units*(m.unitCost||0);
      return `<tr><td><span style="color:${C[m.type]};font-weight:600;font-size:12px">${L[m.type]}</span>
        ${p?' · '+esc(p.name):' · '+esc(m.cat||'')}${pend.has(m.id)?' <span class="tag bad">sin subir</span>':''}
        <br><span class="tag">${m.date}${m.units?' · '+(m.units>0&&m.type==='ADJUST'?'+':'')+m.units+' uds':''}${m.slot?' · casilla '+m.slot:''}${m.note?' · '+esc(m.note):''}</span></td>
        <td class="r num">${Q(amt)}</td>
        <td class="r" style="width:30px"><button data-undo="${m.id}" style="background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px">×</button></td></tr>`}).join('')}
  </tbody></table></div>`;
}

/* ---------- eventos ---------- */
function wire(){
  const v=el('view');
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;render()});
  v.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{
    const slot=+b.dataset.slot;
    if(maquinaMode==='fix') fixModal(b.dataset.sell,slot); else sellModal(b.dataset.sell,slot);
  });
  v.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>fixModal(b.dataset.fix));
  v.querySelectorAll('[data-cargar]').forEach(b=>b.onclick=()=>cargarModal(b.dataset.cargar));
  v.querySelectorAll('[data-mmode]').forEach(b=>b.onclick=()=>{maquinaMode=b.dataset.mmode;render()});
  v.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{if(confirm('¿Deshacer este movimiento?'))undo(b.dataset.undo)});
  v.querySelectorAll('[data-price]').forEach(i=>i.onchange=async()=>{
    const p=P(i.dataset.price); p.price=+i.value||0; render();
    await sb.from('products').update({price:p.price}).eq('id',p.id);
  });
  v.querySelectorAll('[data-cat]').forEach(s=>s.onchange=()=>setProdCat(s.dataset.cat,s.value));
  v.querySelectorAll('[data-slots]').forEach(i=>i.onchange=()=>setProdSlots(i.dataset.slots,i.value));
  v.querySelectorAll('[data-cren]').forEach(b=>b.onclick=()=>catRenModal(b.dataset.cren));
  v.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>catDelModal(b.dataset.cdel));
  const nc=el('ncat'); if(nc)nc.onkeydown=e=>{if(e.key==='Enter')el('btnCat').click()};
  const bCat=el('btnCat'); if(bCat)bCat.onclick=()=>catAdd(el('ncat').value);
  const rp=el('rp'); if(rp)rp.onchange=()=>{const p=P(rp.value);el('rc').value=p.avgCost??''};
  const bBuy=el('btnBuy'); if(bBuy)bBuy.onclick=async()=>{
    const pid=el('rp').value,u=+el('ru').value,p=P(pid);
    const c=el('rc').value===''?(p.avgCost??0):+el('rc').value;
    if(!u||u<=0)return toast('Falta el número de unidades');
    if(!c||c<=0)return toast('Falta el costo por unidad');
    await purchase(pid,u,c,el('rd').value||today(),el('rn').value);
    toast(`${u} × ${p.name} · inventario +${Q(u*c)}`);
  };
  const bW=el('btnW'); if(bW)bW.onclick=async()=>{
    const pid=el('wp').value,u=+el('wu').value;
    if(!u||u<=0)return toast('Falta el número de unidades');
    await merma(pid,u,today(),el('wn').value); toast(`Baja de ${u} × ${P(pid).name}`);
  };
  const bG=el('btnG'); if(bG)bG.onclick=async()=>{
    const a=+el('ga').value; if(!a||a<=0)return toast('Falta el monto');
    await gasto(el('gc').value,a,el('gd').value||today(),el('gn').value); toast('Gasto registrado');
  };
  const bC=el('btnCnt'); if(bC)bC.onclick=applyConteo;
  const ms=el('mSel'); if(ms)ms.onchange=()=>{plMonth=ms.value;render()};
  const cp=el('comPct'); if(cp)cp.onchange=async()=>{
    S.settings.commissionPct=Math.max(0,Math.min(100,+cp.value||0)); render();
    await sb.from('settings').upsert({id:1,commission_pct:S.settings.commissionPct});
  };
  const bx=el('btnCsv'); if(bx)bx.onclick=exportCSV;
}

/* Corregir por CASILLA = decir dónde está físicamente lo que ya tenés: mueve entre
   Bodega y la casilla (como Cargar), NO toca el total del producto.
   Corregir el TOTAL GENERAL (sin casilla, desde Inventario) sí ajusta el total: es
   para cuando el número general está mal (se perdió, se encontró, error de captura). */
function fixModal(pid,slot){
  const p=P(pid);
  const bySlot=slot!=null&&!Number.isNaN(slot);
  const cur=bySlot?(p.slotStock[slot]??0):p.stock;
  const enMaquina=p.slots.reduce((s,sl)=>s+(p.slotStock[sl]??0),0);
  const enBodega=Math.round((p.stock-enMaquina)*100)/100;
  el('modal').innerHTML=`<div class="scrim"><div class="sheet">
    <div class="eyebrow">${bySlot?`Corregir casilla ${slot}`:'Corregir total general'}</div><h2 style="font-size:20px">${esc(p.name)}</h2>
    <p class="hint" style="margin-top:4px">El sistema dice <b>${cur}</b>. Poné las unidades reales.</p>
    <div class="qty"><button id="fm">−</button><input class="num" id="fv" type="number" value="${cur}" min="0"><button id="fp">+</button></div>
    ${bySlot?'':'<label>Motivo</label><input id="fn" placeholder="me equivoqué al registrar">'}
    <div class="warn" style="margin:12px 0 0">${bySlot
      ?`Esto <b>no</b> cambia tu total general (ahora mismo tenés ${p.stock}, de los cuales ${enBodega} están en Bodega sin casilla): solo mueve unidades entre Bodega y esta casilla. Si de verdad falta o sobra producto en el total, corregilo desde Inventario → total general.`
      :`Esto <b>no</b> es venta ni merma: solo arregla el número general. Si el producto se venció, se robó o lo regalaste, usá <b>Merma</b> en Restock — eso sí debe pegarle a tu utilidad. Esto no toca ninguna casilla puntual — para eso, hacelo desde Máquina → Corregir.`}</div>
    <button class="act" id="fok">Corregir</button><button class="act ghost" id="fx">Cancelar</button></div></div>`;
  const q=el('fv');
  el('fm').onclick=()=>q.value=Math.max(0,(+q.value||0)-1);
  el('fp').onclick=()=>q.value=(+q.value||0)+1;
  el('fx').onclick=closeModal;
  el('modal').querySelector('.scrim').onclick=e=>{if(e.target===e.currentTarget)closeModal()};
  el('fok').onclick=async()=>{
    const real=+q.value, d=real-cur;
    const note=bySlot?'corrección de casilla':(el('fn').value||'corrección');
    closeModal();
    if(!d) return;
    const id=bySlot ? await cargar(pid,d,today(),slot,note) : await ajuste(pid,d,today(),note);
    toast(`${p.name}${bySlot?` (casilla ${slot})`:''}: ${cur} → ${real}`,id);
  };
}

function sellModal(pid,slot){
  const p=P(pid);
  const bySlot=slot!=null&&!Number.isNaN(slot);
  const left=bySlot?(p.slotStock[slot]??0):p.stock;
  el('modal').innerHTML=`<div class="scrim"><div class="sheet">
    <div class="eyebrow">Registrar venta${bySlot?` · casilla ${slot}`:''}</div><h2 style="font-size:20px">${esc(p.name)}</h2>
    <p class="hint" style="margin-top:4px">Precio ${Q(p.price)} · costo ${p.avgCost==null?'<span class="tag bad">sin costo</span>':Q(p.avgCost)} · quedan ${left}</p>
    <div class="qty"><button id="qm">−</button><input class="num" id="qv" type="number" value="1" min="1"><button id="qp">+</button></div>
    <button class="act" id="qok">Vender</button><button class="act ghost" id="qx">Cancelar</button></div></div>`;
  const q=el('qv');
  el('qm').onclick=()=>q.value=Math.max(1,(+q.value||1)-1);
  el('qp').onclick=()=>q.value=(+q.value||0)+1;
  el('qx').onclick=closeModal;
  el('modal').querySelector('.scrim').onclick=e=>{if(e.target===e.currentTarget)closeModal()};
  el('qok').onclick=async()=>{
    const n=+q.value||0; if(n<=0)return; closeModal();
    const id=await sell(pid,n,today(),'',bySlot?slot:undefined);
    toast(`${n} × ${p.name} · ${Q(n*p.price)}`,id);
  };
}

function cargarModal(pid){
  const p=P(pid);
  if(!p.slots.length) return toast('Asignale una casilla primero en Productos');
  const enMaquina=p.slots.reduce((s,sl)=>s+(p.slotStock[sl]??0),0);
  const enBodega=Math.round((p.stock-enMaquina)*100)/100;
  if(enBodega<=0) return toast('No hay nada en bodega para este producto');
  const opts=p.slots.map(s=>`<option value="${s}">Casilla ${s} (tiene ${p.slotStock[s]??0})</option>`).join('');
  el('modal').innerHTML=`<div class="scrim"><div class="sheet">
    <div class="eyebrow">Cargar a la máquina</div><h2 style="font-size:20px">${esc(p.name)}</h2>
    <p class="hint" style="margin-top:4px">Tenés <b>${enBodega}</b> en bodega.</p>
    <label>Casilla</label><select id="lgSlot">${opts}</select>
    <div class="qty" style="margin-top:10px"><button id="lm">−</button><input class="num" id="lv" type="number" value="1" min="1" max="${enBodega}"><button id="lp">+</button></div>
    <button class="act" id="lok">Cargar</button><button class="act ghost" id="lx">Cancelar</button></div></div>`;
  const q=el('lv');
  el('lm').onclick=()=>q.value=Math.max(1,(+q.value||1)-1);
  el('lp').onclick=()=>q.value=Math.min(enBodega,(+q.value||0)+1);
  el('lx').onclick=closeModal;
  el('modal').querySelector('.scrim').onclick=e=>{if(e.target===e.currentTarget)closeModal()};
  el('lok').onclick=async()=>{
    const n=Math.min(enBodega,Math.max(0,+q.value||0)), slot=+el('lgSlot').value; closeModal();
    if(n<=0) return;
    const id=await cargar(pid,n,today(),slot,'carga desde bodega');
    toast(`${n} × ${p.name} → casilla ${slot}`,id);
  };
}

function exportCSV(){
  const head='fecha,tipo,producto,categoria,unidades,costo_unit,precio_unit,monto,nota';
  const rows=S.movements.map(m=>{const p=m.pid?P(m.pid):null;
    const amt=m.type==='EXPENSE'?m.amount:m.type==='SALE'?m.units*m.unitPrice:m.units*(m.unitCost||0);
    return [m.date,m.type,p?p.name:'',m.cat||'',m.units||'',m.unitCost??'',m.unitPrice??'',(+amt).toFixed(2),
      (m.note||'').replace(/,/g,';')].join(',')});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([head+'\n'+rows.join('\n')],{type:'text/csv'}));
  a.download='vendos_libro.csv'; a.click();
}

/* ---------- arranque ---------- */
async function boot(){
  el('view').innerHTML='<div class="gate"><p class="hint">Cargando…</p></div>';
  try{ await load(); }
  catch(e){
    el('hdr').style.display='none';
    el('view').innerHTML=`<div class="gate"><div class="warn err"><b>No se pudo cargar.</b><br>${esc(e.message||e)}
      <br><br>Si dice que la tabla no existe, falta correr el SQL en Supabase.</div>
      <button class="act ghost" onclick="location.reload()">Reintentar</button></div>`;
    return;
  }
  render(); flush();
  window.addEventListener('online',flush);
}
boot();
</script>
